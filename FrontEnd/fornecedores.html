<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fornecedores</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <!-- ============ MENU LATERAL ============ -->
    <aside class="sidebar">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Minha Loja</span>
      </a>

      <nav class="nav" aria-label="Principal">
        <a href="index.html" class="nav-link">Painel</a>
        <a href="fornecedores.html" class="nav-link is-active" aria-current="page">Fornecedores</a>
      </nav>

      <div class="sidebar-user">
        <span class="avatar">AD</span>
        <div>
          <strong>Administrador</strong>
          <small>admin@minhaloja.com</small>
        </div>
      </div>
    </aside>

    <!-- ============ CONTEÚDO ============ -->
    <div class="main">

      <header class="topbar">
        <div class="topbar-title">
          <h1>Fornecedores</h1>
          <p>Cadastro de fornecedores da loja</p>
        </div>

        <div class="topbar-actions">
          <button class="btn btn--primary" type="button" id="btn-novo">Novo fornecedor</button>
        </div>
      </header>

      <main class="content">

        <!-- Mensagens de sucesso/erro (preenchida pelo JavaScript) -->
        <div id="mensagem" class="alert" role="status" hidden></div>

        <!-- ---------- FORMULÁRIO (cadastro e edição) ----------
             Campo escondido cd_fornecedor:
               vazio      -> cadastro (POST)
               preenchido -> edição   (PUT)                     -->
        <section class="panel" id="painel-form" hidden>
          <div class="panel-head">
            <h2 id="titulo-form">Novo fornecedor</h2>
          </div>

          <form id="form-fornecedor" class="form">
            <input type="hidden" id="cd_fornecedor" name="cd_fornecedor">

            <div class="field field--wide">
              <label for="nm_fornecedor">Nome *</label>
              <input id="nm_fornecedor" name="nm_fornecedor" maxlength="100" required>
            </div>

            <div class="field">
              <label for="nr_cnpj">CNPJ * <small>(14 números)</small></label>
              <input id="nr_cnpj" name="nr_cnpj" inputmode="numeric" maxlength="18" required>
            </div>

            <div class="field">
              <label for="ds_email">E-mail *</label>
              <input id="ds_email" name="ds_email" type="email" maxlength="100" required>
            </div>

            <div class="field">
              <label for="nr_telefone">Telefone <small>(opcional, com DDD)</small></label>
              <input id="nr_telefone" name="nr_telefone" inputmode="numeric" maxlength="15">
            </div>

            <div class="field field--check">
              <input type="checkbox" id="is_ativo" name="is_ativo" checked>
              <label for="is_ativo">Fornecedor ativo</label>
            </div>

            <div class="form-actions">
              <button type="button" class="btn btn--ghost" id="btn-cancelar">Cancelar</button>
              <button type="submit" class="btn btn--primary">Salvar</button>
            </div>
          </form>
        </section>

        <!-- ---------- LISTAGEM ---------- -->
        <section class="panel panel--table">
          <div class="panel-head">
            <h2>Lista de fornecedores</h2>

            <div class="filters" role="group" aria-label="Filtrar por situação">
              <button class="chip is-active" type="button" data-status="ativos">Ativos</button>
              <button class="chip" type="button" data-status="inativos">Inativos</button>
              <button class="chip" type="button" data-status="todos">Todos</button>
            </div>
          </div>          

          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>Código</th>
                  <th>Nome</th>
                  <th>CNPJ</th>
                  <th>E-mail</th>
                  <th>Telefone</th>
                  <th>Situação</th>
                  <th><span class="sr-only">Ações</span></th>
                </tr>
              </thead>

              <!-- As linhas são criadas pelo JavaScript com os dados da API -->
              <tbody id="tabela-fornecedores">
                <tr><td colspan="7">Carregando...</td></tr>
              </tbody>
            </table>
          </div>
        </section>

      </main>
    </div>
  </div>

  <script src="fornecedores.js"></script>
</body>
</html>
